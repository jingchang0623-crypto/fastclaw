allowBuilds:
  # Both ship prebuilt binaries; their install scripts are a source-build
  # fallback we don't need. Explicit decisions keep pnpm >=11 from failing
  # install with ERR_PNPM_IGNORED_BUILDS.
  '@parcel/watcher': false
  '@swc/core': false
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - msw
  - sharp
  - unrs-resolver
overrides:
  'ip-address@<10.1.1': '>=10.1.1'
  'postcss@<8.5.10': '>=8.5.10'
